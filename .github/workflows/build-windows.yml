name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate app icon from logo.png
        run: |
          python -c "from PIL import Image; img = Image.open('assets/logo.png'); img.save('assets/logo.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --name "SubGen"
          --windowed
          --onedir
          --icon "assets/logo.ico"
          --collect-all customtkinter
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all deep_translator
          --collect-all tiktoken
          --collect-all tokenizers
          --collect-all sounddevice
          --collect-all pymupdf
          --hidden-import tkinter
          --hidden-import tkinter.filedialog
          --hidden-import tkinter.messagebox
          --hidden-import faster_whisper
          --hidden-import ctranslate2
          --clean
          --noconfirm
          subgen.py

      - name: Bundle runtime assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force assets dist/SubGen/assets
          if (Test-Path bin) { Copy-Item -Recurse -Force bin dist/SubGen/bin }

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist/SubGen/* -DestinationPath SubTranscribe-Studio-Windows-Portable.zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SubTranscribe-Studio-Windows
          path: |
            SubTranscribe-Studio-Windows-Portable.zip
            dist/SubTranscribe_Studio_Setup_*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SubTranscribe Studio ${{ github.ref_name }}
          body: |
            ## 🚀 SubTranscribe Studio ${{ github.ref_name }}

            **Local, private, AI-powered subtitle generator, translator & audio intelligence studio**

            ---

            ### 📦 Downloads & Installation Assets

            - **`SubTranscribe_Studio_Setup_v1.0.0.exe`** — Windows Setup Installer *(Recommended: creates Start Menu shortcut & clean uninstaller)*
            - **`SubTranscribe-Studio-Windows-Portable.zip`** — Portable Standalone Bundle *(Unzip and double-click `SubGen.exe`)*

            ---

            ### ✨ Highlights & Features

            - 🔒 **100% Private & Offline**: Speech recognition and translation run completely locally on your PC.
            - ⚡ **Hardware Accelerated**: Automatically utilizes NVIDIA CUDA (GPU), AMD/Intel Vulkan, or CPU quantized inference.
            - 🎙️ **Multi-Format Subtitle Export**: Save as **SRT**, **WebVTT**, **ASS (SubStation Alpha)**, or plain **TXT**.
            - 🌐 **100+ Languages**: Automatic language detection and translation support.
            - 📼 **Batch Processing**: Queue up and process multiple audio/video files automatically.
            - 🎛️ **Live Waveform & Subtitle Studio**: Synchronized waveform audio player with real-time subtitle verification & inline editor.

            ---

            > **💡 Windows SmartScreen Notice**: If Windows flags the installer as an unrecognized publisher on first run, click **More info → Run anyway** to proceed.
          files: |
            SubTranscribe-Studio-Windows-Portable.zip
            dist/SubTranscribe_Studio_Setup_*.exe
          generate_release_notes: true
