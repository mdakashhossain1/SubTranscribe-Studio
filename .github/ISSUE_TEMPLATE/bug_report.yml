name: 🐛 Bug Report
description: Create a report to help us fix a bug or issue in SubTranscribe Studio
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what happened and what you expected to happen.
      placeholder: Tell us what happened...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open SubTranscribe Studio
        2. Click on '...'
        3. Select file '...'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: os-version
    attributes:
      label: Operating System
      options:
        - Windows 11 (64-bit)
        - Windows 10 (64-bit)
        - Windows Server / Other
    validations:
      required: true
  - type: dropdown
    id: gpu-hardware
    attributes:
      label: Hardware / Acceleration Mode
      options:
        - NVIDIA GPU (CUDA)
        - AMD / Intel GPU (Vulkan)
        - CPU Only Mode
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Application Logs
      description: Paste log lines from the "Logs" tab inside the application.
      render: text
    validations:
      required: false
